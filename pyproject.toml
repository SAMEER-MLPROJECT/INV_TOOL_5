[project]
name = "sakshya"
version = "1.0.0"
description = "Evidence correlation and crime reconstruction engine for cyber fraud investigations"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E741", "RUF001", "RUF003", "RUF046", "B008", "B905"]
